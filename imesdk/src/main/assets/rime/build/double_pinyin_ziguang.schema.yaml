# `cn_en` 段的中英混输词表是 stabledb（librime 直接把 `*.txt` 当只读库读），
# 不走编译，所以词表随 pack 放在 `en_dicts/` 下，见 tools/build-rime-pack.py。
# 解析顺序是「用户目录 → shared 目录」回退，pack 目录即 shared 目录。

cn_en:
  db_class: stabledb
  dictionary: ""
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  user_dict: "en_dicts/cn_en_ziguang"
emoji:
  inherit_comment: false
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@emoji"
    - simplifier                # t2s：关闭繁体时把词典 / 用户词库里的繁体候选转成简体
    - "simplifier@traditionalize"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - script_translator
    - "table_translator@english"
    - "table_translator@cn_en"
english:
  dictionary: english
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
menu:
  page_size: 30
punctuator:
  symbols:
    "/": ["@", "＃", "＊", "＋", "……", "〜", "（", "）", "、", "/"]
recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"
schema:
  name: "紫光双拼"
  schema_id: double_pinyin_ziguang
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;`/"
  delimiter: "''"
  algebra:
    # 零声母（实测自旧棱镜码空间）
    - xform/^a$/oa/
    - xform/^e$/oe/
    - xform/^o$/oo/
    - xform/^er$/oj/
    - xform/^ei$/ok/
    - xform/^ai$/op/
    - xform/^ao$/oq/
    - xform/^an$/or/
    - xform/^en$/ow/
    - xform/^ou$/oz/
    - xform/^ang$/os/
    - xform/^eng$/ot/
    # ch → a
    - derive/^ch/a/
    # sh → i
    - derive/^sh/i/
    # zh → u
    - derive/^zh/u/
    - derive/^([aghiku])uang$/\1g/
    - derive/^([bjlnqx])iang$/\1g/
    - derive/^([jqx])iong$/\1h/
    - derive/^([acdghklnrstuyz])ong$/\1h/
    - derive/^([acdghijklnqrstuxyz])uan$/\1l/
    - derive/^([abcdfghiklmnprstuwyz])ang$/\1s/
    - derive/^([abcdfghiklmnprstuwz])eng$/\1t/
    - derive/^([aghiku])uai$/\1y/
    - derive/^([bdfjlmnpqtx])iao$/\1b/
    - derive/^([bdjlmnpqtx])ian$/\1f/
    - derive/^([acdghijklqrstuxyz])un$/\1m/
    - derive/^([acdghikrstuz])ui$/\1n/
    - derive/^([acdghiklnrstuz])uo$/\1o/
    - derive/^([abcdghiklmnpstuwz])ai$/\1p/
    - derive/^([abcdghiklmnprstuyz])ao$/\1q/
    - derive/^([abcdfghiklmnprstuwyz])an$/\1r/
    - derive/^([abcdfghikmnprsuwz])en$/\1w/
    - derive/^([aghikru])ua$/\1x/
    - derive/^([acdfghiklmnprstuyz])ou$/\1z/
    - derive/^([bdjlmnpqtx])ie$/\1d/
    - derive/^([bcdfghiklmnptuwz])ei$/\1k/
    - derive/^([bjlmnpqxy])in$/\1y/
    - derive/^([djlmnqx])iu$/\1j/
    - derive/^([djlqx])ia$/\1x/
    - derive/^([jqxy])ue$/\1n/
    - derive/^([ln])ve$/\1n/
    - derive/^([jqxy])u$/\1v/
    # 超级简拼（放在映射之后，所以取到的是双拼码的首字母）
    - abbrev/^([a-z]).+$/$1/
# 关闭「繁体输入」时由引擎侧 OpenCC 做 t2s，而不是在应用侧按字反查后丢弃候选：
# 短语表（TSPhrases）保护「乾坤」「乾隆」「瞭望」这类简体里保留古字的词，逐字表
# 按 OpenCC 的默认值处理多写法，不会再误杀合法简体词。
# 打开繁体时本过滤器关闭（simplification=false），由下面的 traditionalize 做 s2t。
simplifier:
  opencc_config: t2s.json
  option_name: simplification
  # 转换后的候选必须保留原始读音注释：RimeEngine 的模糊音/纠错归因与来源排序都靠它。
  inherit_comment: true
traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
  inherit_comment: true
translator:
  always_show_comments: true
  dictionary: pinyin
  initial_quality: 1.2
  prism: double_pinyin_ziguang
  spelling_hints: 100
