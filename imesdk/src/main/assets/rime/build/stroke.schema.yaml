# 五笔画。词库来自 rime 官方仓 rime/rime-stroke（LGPL-3.0-or-later，
# 主码表源自台湾 CNS11643 全字库、附码表源自北大中文论坛），
# 由 tools/build-rime-pack.py 从 build/upstream/rime-stroke 取源编译。
#
# 上游用小写 hspnz 作码，本应用的笔画键盘送大写码（InputView 给笔画/九宫格
# 键盘带 META_CAPS_LOCK_ON），所以这里用 xform 把码整体翻成大写。
# 用 xform 而非 derive 是刻意的：逐字母 derive 会让每个笔画码产生 2^码长 个
# 大小写变体，棱镜会爆炸。
schema:
  name: "笔画输入"
  schema_id: stroke
engine:
  filters:
    - "simplifier@emoji"
    - simplifier                # t2s：关闭繁体时把词典 / 用户词库里的繁体候选转成简体
    - "simplifier@traditionalize"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - table_translator
menu:
  page_size: 30
punctuator:
  symbols:
    "/": ["@", "＃", "＊", "＋", "……", "〜", "（", "）", "、", "/"]
recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`/"
  delimiter: " '"
  algebra:
    - xform/h/H/
    - xform/s/S/
    - xform/p/P/
    - xform/n/N/
    - xform/z/Z/
# 关闭「繁体输入」时由引擎侧 OpenCC 做 t2s，而不是在应用侧按字反查后丢弃候选：
# 短语表（TSPhrases）保护「乾坤」「乾隆」「瞭望」这类简体里保留古字的词，逐字表
# 按 OpenCC 的默认值处理多写法，不会再误杀合法简体词。
# 打开繁体时本过滤器关闭（simplification=false），由下面的 traditionalize 做 s2t。
simplifier:
  opencc_config: t2s.json
  option_name: simplification
  # 转换后的候选必须保留原始读音注释：RimeEngine 的模糊音/纠错归因与来源排序都靠它。
  inherit_comment: true
traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
  inherit_comment: true
translator:
  comment_format:
    - xlit/HSPNZ/⼀⼁⼃⼂⼄/
  dictionary: stroke
  preedit_format:
    - xlit/HSPNZ/⼀⼁⼃⼂⼄/
