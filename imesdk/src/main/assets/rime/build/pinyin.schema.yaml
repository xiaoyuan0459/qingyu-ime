# `cn_en` 段的中英混输词表是 stabledb（librime 直接把 `*.txt` 当只读库读），
# 不走编译，所以词表随 pack 放在 `en_dicts/` 下，见 tools/build-rime-pack.py。
# 解析顺序是「用户目录 → shared 目录」回退，pack 目录即 shared 目录。

cn_en:
  db_class: stabledb
  dictionary: ""
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  user_dict: "en_dicts/cn_en"
emoji:
  # 展开后的 emoji 候选要带上真实读音注释，模糊音开关关闭时才能把它一起过滤掉
  inherit_comment: true
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@emoji"
    - "simplifier@traditionalize"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - script_translator
    - "table_translator@english"
    - "table_translator@cn_en"
english:
  dictionary: english
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
menu:
  page_size: 30
punctuator:
  symbols:
    "/": ["@", "＃", "＊", "＋", "……", "〜", "（", "）", "、", "/"]
recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"
schema:
  name: "全键拼音"
  schema_id: pinyin
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`/"
  delimiter: "''"
  # 拼写规则。继承来的这份 schema 里 algebra 被剥掉了（见 MIGRATION.md），
  # 下面这四条不是照抄任何上游方案，而是用 `qingyu_probe` 实测旧棱镜的码空间后
  # 反推出的最小集合：414 个音节 + 23 个单字母简拼 + zh/ch/sh + jv/qv/xv/yv
  # 与 lue/nue 等替代写法，逐码差分零差异为准绳（见 PROJECT_LOG M3 条目）。
  algebra:
    - derive/^([jqxy])u/$1v/      # 居拼音的 ü 写作 v：ju → jv
    - derive/^([nl])ve$/$1ue/     # 律/略 一类写成 lue/nue 时也认
    - abbrev/^([a-z]).+$/$1/      # 超级简拼：单字母
    - abbrev/^([zcs]h).+$/$1/     # 简拼里 zh/ch/sh 视为整体，不被 'z' 抢走
    # 模糊音：librime 1.11.2 的拼写运算不支持「按开关生效」—— Calculus::Parse 只取
    # 前两段，第三段之后的名字被静默丢弃，写在这里等于常开。改用 fuzz：派生拼写标成
    # kFuzzySpelling 并扣 log(0.5) 可信度，本码候选仍排在模糊码之前。
    # 开关的「关」由 RimeEngine 侧的 FuzzySpellingGate 按候选注释里的真实读音过滤，
    # 下面每条结尾的组名必须与那张表逐条对齐（有单测把两边钉在一起）。
    - "fuzz/^([zcs])h/$1/"            # zh_z：zh/ch/sh 认作 z/c/s
    - "fuzz/^([zcs])([^h])/$1h$2/"    # zh_z：反向
    - "fuzz/^n/l/"                    # n_l
    - "fuzz/^l/n/"                    # n_l
    - "fuzz/^f/h/"                    # f_h
    - "fuzz/^h/f/"                    # f_h
    - "fuzz/([aeiou])ng$/$1n/"        # nasal
    - "fuzz/([aeiou])n$/$1ng/"        # nasal
    # >>> 相邻键纠错表（tools/gen-adjacent-key-algebra.py 生成，勿手改）
    # 每条把一步邻键误触的变体纠回本音节；本身是合法音节或基础派生写法的
    # 变体已剔除，多音节共有的变体各留一条（按词频同场竞争）。
    # 用 correct 而不是 derive：纠错拼写被标成 kCorrectionSpelling，类型排在
    # abbrev 之后；同一位置存在精确/简拼路径时音节图会剪掉纠错边，只有没有
    # 正常路径时才保留纠错（yuanl 不再被 yua'nl 抢走）。
    # 重跑生成：python tools/gen-adjacent-key-algebra.py --write
    - "correct/^ai$/aj/"
    - "correct/^ai$/ak/"
    - "correct/^ai$/al/"
