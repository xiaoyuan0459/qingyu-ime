name: Build and check

'on':
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Attach a locally signed APK to this draft tag (empty runs the normal build)'
        type: string
        default: ''
      source_run_id:
        description: 'Successful tag build containing the unsigned APK'
        type: string
        default: ''
      signed_apk_sha256:
        description: 'SHA-256 of the locally verified signed APK'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: /tmp/qingyu-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reserve disk space for native build
        run: |
          # These preinstalled toolchains are unused; the pinned NDK is installed below.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare Android toolchain
        timeout-minutes: 10
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
      - name: Restore native compiler cache
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-${{ runner.os }}-${{ hashFiles('tools/native-deps.lock.json', 'imesdk/src/main/cpp/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Install pinned Android packages
        timeout-minutes: 15
        shell: bash
        run: |
          sdkmanager --channel=3 --include_obsolete "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1"
          if [[ ! -d "$ANDROID_HOME/platforms/android-37" && -d "$ANDROID_HOME/platforms/android-37.0" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Prepare pinned native dependencies
        timeout-minutes: 10
        run: python tools/bootstrap-native-deps.py
      - name: Validate dependency and license inputs
        run: |
          python tools/bootstrap-native-deps.py --check
          python tools/check-native-licenses.py
          python tools/check-native-pack.py
      - name: Build and lint
        # Run the same standalone protocol tests used before publishing source.
        # They use synthetic temporary inputs and do not access device/user data.
        # Keep this gate alongside the Android build for tag packaging as well.
        run: |
          python -B tools/test_ime_evaluation.py
          python -B tools/test_freq_chat_partitions.py
          python -B tools/test_rime_source_provenance.py
          python -B tools/test_signed_apk_delta.py
          chmod +x gradlew
          ./gradlew :app:assembleOfflineDebug :imesdk:testOfflineDebugUnitTest :imesdk:lintOfflineDebug :app:lintOfflineDebug --max-workers=2 --warning-mode=all
          mkdir -p dist
          cp app/build/outputs/apk/offline/debug/*.apk dist/
          ./gradlew :app:assembleOfflineRelease :app:lintOfflineRelease -PqingyuUnsignedRelease=true --max-workers=2 --warning-mode=all
          cp app/build/outputs/apk/offline/release/*-unsigned.apk dist/
          ./gradlew -I tools/dependency-inventory.gradle :app:writeDependencyInventory --max-workers=2
          git diff --exit-code -- imesdk/schemas
          git diff --check
          ccache --show-stats
          df -h /
      - name: Upload development APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-${{ github.sha }}
          path: |
            dist/*.apk
            app/build/reports/lint-results-offlineDebug.*
            imesdk/build/reports/lint-results-offlineDebug.*
            app/build/reports/lint-results-offlineRelease.*
            imesdk/build/test-results/testOfflineDebugUnitTest/*.xml
            app/build/reports/dependency-inventory.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save native compiler cache
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  # Private release keys remain local. The tag workflow prepares a draft after CI passes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Prepare draft for locally verified signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --draft --prerelease --generate-notes
          fi

  # Transfer public signature data instead of uploading private keys or the full APK.
  # SignRelease.java verifies local signing first; the relay must reproduce those exact bytes.
  attach-signed-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.publish_tag }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      APK_SHA: ${{ inputs.signed_apk_sha256 }}
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Verify draft tag and successful source build
        id: source
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'v[0-9][A-Za-z0-9._-]*', os.environ['TAG']), 'Invalid tag'
          assert re.fullmatch(r'[0-9]+', os.environ['SOURCE_RUN']), 'Invalid source run'
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['APK_SHA']), 'Invalid APK SHA-256'
          PY
          mkdir -p relay
          gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' > relay/source-sha.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > relay/run.json
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > relay/release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha = Path('relay/source-sha.txt').read_text().strip()
          run = json.loads(Path('relay/run.json').read_text())
          assert run['head_sha'] == sha, 'Source build differs from tag'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Source build not successful'
          assert run['event'] == 'push' and run['head_branch'] == os.environ['TAG'], 'Not a tag build'
          assert run['path'] == '.github/workflows/build.yml', 'Unexpected source workflow'
          assert json.loads(Path('relay/release.json').read_text())['isDraft'], 'Release must remain a draft during relay'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY
      - name: Prepare APK verification tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'build-tools;37.0.0'
      - name: Restore and verify signed APK
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "android-build-$SOURCE_SHA" --dir relay/input
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern signature-delta.json.gz --dir relay
          unsigned_apk=$(python - <<'PY'
          from pathlib import Path
          apks = list(Path('relay/input').rglob('*-release-unsigned.apk'))
          assert len(apks) == 1, 'Expected one unsigned Release APK'
          print(apks[0])
          PY
          )
          signed_apk="relay/qingyu-ime-$TAG-arm64-v8a.apk"
          python tools/signed-apk-delta.py restore "$unsigned_apk" relay/signature-delta.json.gz "$signed_apk" --sha256 "$APK_SHA"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$signed_apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$signed_apk" > relay/signature.log
          python - <<'PY'
          from pathlib import Path
          import re
          cert = re.search(r'certificate SHA-256 digest: ([a-f0-9]+)', Path('relay/signature.log').read_text()).group(1)
          assert cert == '8c1ba7bdf1d6d608fc806913ec2fc1efa72a6bdff94fecad2a7f7c3b29eb5a3d', 'Unexpected release certificate'
          PY
      - name: Attach verified APK and remove relay data
        run: |
          signed_apk="relay/qingyu-ime-$TAG-arm64-v8a.apk"
          gh release upload "$TAG" "$signed_apk" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > relay/assets.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          name = f"qingyu-ime-{os.environ['TAG']}-arm64-v8a.apk"
          asset = next(a for a in json.loads(Path('relay/assets.json').read_text())['assets'] if a['name'] == name)
          assert asset['state'] == 'uploaded' and asset['digest'] == 'sha256:' + os.environ['APK_SHA'], 'Release asset digest mismatch'
          PY
          gh release delete-asset "$TAG" signature-delta.json.gz --repo "$GITHUB_REPOSITORY" --yes
          echo "Verified signed APK attached to draft Release $TAG. Publish after reviewing its notes and checksums." >> "$GITHUB_STEP_SUMMARY"
