name: Build and check

'on':
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: /tmp/qingyu-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reserve disk space for native build
        run: |
          # These preinstalled toolchains are unused; the pinned NDK is installed below.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare Android toolchain
        timeout-minutes: 10
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
      - name: Restore native compiler cache
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-${{ runner.os }}-${{ hashFiles('tools/native-deps.lock.json', 'imesdk/src/main/cpp/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Install pinned Android packages
        timeout-minutes: 15
        shell: bash
        run: |
          sdkmanager --channel=3 --include_obsolete "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1"
          if [[ ! -d "$ANDROID_HOME/platforms/android-37" && -d "$ANDROID_HOME/platforms/android-37.0" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Prepare pinned native dependencies
        timeout-minutes: 10
        run: python tools/bootstrap-native-deps.py
      - name: Validate dependency and license inputs
        run: |
          python tools/bootstrap-native-deps.py --check
          python tools/check-native-licenses.py
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOfflineDebug :imesdk:lintOfflineDebug :app:lintOfflineDebug --max-workers=2 --warning-mode=all
          ./gradlew -I tools/dependency-inventory.gradle :app:writeDependencyInventory --max-workers=2
          git diff --exit-code -- imesdk/schemas
          git diff --check
          ccache --show-stats
          df -h /
      - name: Upload development APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/offline/debug/*.apk
            app/build/reports/lint-results-offlineDebug.*
            imesdk/build/reports/lint-results-offlineDebug.*
            app/build/reports/dependency-inventory.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save native compiler cache
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  # 打 tag 推送时把同一次运行的 APK 附加到 GitHub Release。
  # 复用 android 作业的产物，不重复编译；用预装的 gh 下载与发布，避免再引入第三方 action。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "offline-debug-$GITHUB_SHA" \
            --dir dist
      - name: Write checksums
        run: |
          cd dist
          find . -name '*.apk' -print0 | xargs -0 sha256sum | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t apks < <(find dist -name '*.apk')
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "没有找到 APK，跳过发布" >&2
            exit 1
          fi
          # 这个作业不 checkout 仓库，gh 无法从工作区推断仓库，必须显式 --repo。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${apks[@]}" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --prerelease --generate-notes \
              dist/SHA256SUMS.txt "${apks[@]}"
          fi
