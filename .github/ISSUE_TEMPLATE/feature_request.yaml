name: 功能请求 / Feature Request
description: 为本项目提供新功能建议 / Suggest a new feature for this project
labels:
  - enhancement

body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要 / Summary
      description: 新功能应该做什么。 / What the new feature should do.
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 替代方案 / Alternative Solution
      description: 其它可能的解决方案（如果有）。 / Other possible solutions, if any.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 附加信息 / Additional Context
      description: 与此功能请求有关的上下文信息或截图。 / Additional context or screenshots about the feature request.
    validations:
      required: false

  - type: textarea
    id: device_info
    attributes:
      label: 设备信息 / Device Information
      description: |
        轻语输入法键盘 →「工具箱 → 反馈参数」会一次插入系统、应用、构建与设备屏幕信息；整段粘贴到本框即可。
        Open the Qingyu IME toolbox → "Feedback info" to insert all fields at once, then paste the block here.
      placeholder: |
        系统版本: Android 13 (API 33)
        应用版本: 0.2.0-dev
        构建信息: 2026-10-30 16:42:05 +0800 (abcdefg)
        品牌/型号: ...
        处理器架构: arm64-v8a
        屏幕: 1080×2400 / 480dpi / 字体 1.00×
    validations:
      required: true
