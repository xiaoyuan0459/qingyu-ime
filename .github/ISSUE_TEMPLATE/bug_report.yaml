name: 问题报告 / Bug Report
description: 创建问题报告以帮助我们改进。 / Create a bug report to help us improve.
labels:
  - bug

body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要 / Summary
      description: 简要描述遇到的问题。请说明预期与实际行为；Pre-Alpha 可报告自行构建版本。 / Describe expected and actual behavior, including self-built Pre-Alpha versions.
    validations:
      required: true

  - type: textarea
    id: step_to_reproduce
    attributes:
      label: 重现步骤 / Steps to Reproduce
      description: 如何重现该问题。 / How to reproduce the bug.
      placeholder: |
        1. 打开某界面 / Open page ...
        2. 点击某菜单 / Click menu ...
        3. 某处出问题 / Something went wrong ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为 / Expected Behavior
      description: 完成上述步骤后应该发生什么。 / What is expected to happen after the steps above.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / Screenshot
      description: 仅附空输入框或合成内容的截图，清除真实输入与个人信息。 / Use an empty field or synthetic input and remove personal information.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 附加信息 / Additional Context
      description: 与此问题相关的上下文信息，比如在问题出现前做了什么、使用了什么主题等。 / Additional context about the bug, eg. what did you do before the bug appears or what theme you are using, etc.
    validations:
      required: false

  - type: textarea
    id: device_info
    attributes:
      label: 设备信息 / Device Information
      description: |
        轻语输入法键盘 →「工具箱 → 反馈参数」会一次插入系统、应用、构建与设备屏幕信息；整段粘贴到本框即可。
        Open the Qingyu IME toolbox → "Feedback info" to insert all fields at once, then paste the block here.
      placeholder: |
        系统版本: Android 13 (API 33)
        应用版本: 0.2.0-dev
        构建信息: 2026-10-30 16:42:05 +0800 (abcdefg)
        品牌/型号: ...
        处理器架构: arm64-v8a
        屏幕: 1080×2400 / 480dpi / 字体 1.00×
    validations:
      required: true
