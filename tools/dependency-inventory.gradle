import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Export the actual runtime resolution, including transitive artifacts, without adding dependencies.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeDependencyInventory') {
        doLast {
            def digest = { file ->
                def sha = MessageDigest.getInstance('SHA-256')
                file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) > 0) sha.update(buffer, 0, count)
                }
                sha.digest().encodeHex().toString()
            }
            def artifacts = app.configurations.offlineDebugRuntimeClasspath.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts
            def dependencies = artifacts.collect {
                [coordinate: it.id.componentIdentifier.displayName, file: it.file.name, sha256: digest(it.file)]
            }.sort { a, b -> a.coordinate <=> b.coordinate ?: a.file <=> b.file }
            def output = new File(app.layout.buildDirectory.get().asFile, 'reports/dependency-inventory.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(dependencies)) + '\n'
        }
    }
}
